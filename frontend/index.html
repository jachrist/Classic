<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12100f" />
  <title>Classic — bli med i spillet</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo">🎼</span> <span>Classic</span></a>
    <span class="spacer"></span>
    <button id="themeBtn" class="icon-btn" title="Bytt tema" aria-label="Bytt tema">☀️</button>
  </header>

  <main class="wrap">
    <h1>Bli med i spillet 🎵</h1>
    <p class="lead">Skriv inn romkoden du har fått av spill-lederen og et kallenavn, så er du med. Dere gjetter musikken fra hver deres mobil — nærmest vinner!</p>

    <div id="msg"></div>

    <section class="card">
      <form id="joinForm">
        <label for="code">Romkode</label>
        <input id="code" class="code-input" type="text" inputmode="latin" maxlength="4" autocomplete="off" placeholder="ABCD" required />
        <label for="name">Kallenavn</label>
        <input id="name" type="text" maxlength="24" autocomplete="off" placeholder="F.eks. Kari" required />
        <div style="height:14px"></div>
        <button class="btn btn-primary" type="submit">Bli med 🎶</button>
      </form>
    </section>
  </main>

  <script type="module" src="/js/index.js"></script>
</body>
</html>
