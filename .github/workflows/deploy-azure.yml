name: Deploy til Azure App Service

# Auto-deploy ved push til main. Kan også kjøres manuelt (Actions → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Ikke kjør to deploys samtidig; avbryt en pågående hvis en ny push kommer.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Sjekk ut koden
        uses: actions/checkout@v4

      - name: Sett opp Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 'npm install' i rota trigger postinstall som installerer API-avhengighetene
      # (inkl. ferdigbygd better-sqlite3 for linux-x64 — samme plattform som App Service).
      - name: Installer avhengigheter
        run: npm install

      - name: Kjør tester
        run: npm test

      - name: Sjekk at app-navn er konfigurert
        run: |
          if [ -z "${{ vars.AZURE_WEBAPP_NAME }}" ]; then
            echo "::error::Sett repository-variabelen AZURE_WEBAPP_NAME (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Deploy til Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
